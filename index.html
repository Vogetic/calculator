<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header><h1>Calculator</h1></header>
    <main>
      <article class="calculator">
        <section class="calculator__screen">0</section>
        <section class="calculator__keys">
          <button class="operator" data-action="add">+</button>
          <button class="operator" data-action="subtract">-</button>
          <button class="operator" data-action="multiply">&times;</button>
          <button class="operator" data-action="divide">÷</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>0</button>
          <button data-action="decimal">.</button>
          <button data-action="clear">AC</button>
          <button class="equal" data-action="calculate">=</button>
        </section>
      </article>
    </main>
    <footer>
      &copy; <time datetime="2026">2026</time> All rights reserved
    </footer>
  </body>
</html>
